name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-disclosure:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Disclose private staging limitation
        run: >-
          echo "CodeQL analysis is deferred while this staging repository is private;
          it will run automatically when the repository is public."

  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore locked dependencies
        run: dotnet restore PathFinder.CalculationKernel.slnx --locked-mode -warnaserror

      - name: Build for analysis
        run: dotnet build PathFinder.CalculationKernel.slnx --no-restore -c Release -warnaserror

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
