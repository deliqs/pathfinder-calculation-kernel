name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for verified and unverified credentials
        uses: trufflesecurity/trufflehog@0c952ace0f842f11c75775922d7400335cf60bc6 # v3.97.1 action
        with:
          version: 3.97.1
          extra_args: --results=verified,unknown
