name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version to build
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate package version
        shell: bash
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a SemVer-compatible value" >&2
            exit 1
          fi

      - name: Build and certify release inputs
        uses: ./.github/actions/certify
        with:
          package-version: ${{ inputs.version }}

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calculation-kernel-${{ inputs.version }}
          path: artifacts/release
          if-no-files-found: error
